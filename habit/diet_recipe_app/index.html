<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet & Recipe Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0B0E14;
            color: #F8FAFC;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #1E293B;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #94A3B8;
            font-size: 1rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: #111827;
            border: 1px solid #1E293B;
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38BDF8, #22D3EE);
        }

        .stat-label {
            font-size: 0.875rem;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .section {
            background: #111827;
            border: 1px solid #1E293B;
            border-radius: 12px;
            padding: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1E293B;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: #F97316;
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background: #EA580C;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }

        .btn-secondary {
            background: #1E293B;
            color: #F8FAFC;
            border: 1px solid #334155;
        }

        .btn-secondary:hover {
            background: #334155;
        }

        .btn-small {
            padding: 0.375rem 0.75rem;
            font-size: 0.813rem;
        }

        .btn-danger {
            background: #DC2626;
            color: #FFFFFF;
        }

        .btn-danger:hover {
            background: #B91C1C;
        }

        .recipe-list {
            display: grid;
            gap: 1rem;
        }

        .recipe-card {
            background: #0F172A;
            border: 1px solid #1E293B;
            border-radius: 8px;
            padding: 1.25rem;
            transition: all 0.2s;
        }

        .recipe-card:hover {
            border-color: #38BDF8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.1);
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.75rem;
        }

        .recipe-name {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .recipe-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.813rem;
            color: #94A3B8;
            font-variant-numeric: tabular-nums;
        }

        .recipe-actions {
            display: flex;
            gap: 0.5rem;
        }

        .meal-log-entry {
            background: #0F172A;
            border: 1px solid #1E293B;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .meal-time {
            font-size: 0.813rem;
            color: #94A3B8;
            font-variant-numeric: tabular-nums;
            margin-bottom: 0.5rem;
        }

        .meal-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .meal-calories {
            font-size: 0.875rem;
            color: #22D3EE;
            font-variant-numeric: tabular-nums;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 14, 20, 0.9);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #111827;
            border: 1px solid #1E293B;
            border-radius: 12px;
            padding: 2rem;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: #94A3B8;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: #1E293B;
            color: #F8FAFC;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #CBD5E1;
            margin-bottom: 0.5rem;
        }

        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            background: #0F172A;
            border: 1px solid #1E293B;
            border-radius: 8px;
            color: #F8FAFC;
            font-family: inherit;
            font-size: 0.938rem;
            transition: all 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #38BDF8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #64748B;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .tag {
            display: inline-block;
            padding: 0.25rem 0.625rem;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #38BDF8;
            font-weight: 500;
        }

        .ingredients-list {
            background: #0F172A;
            border: 1px solid #1E293B;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 0.5rem;
        }

        .ingredient-item {
            padding: 0.5rem 0;
            border-bottom: 1px solid #1E293B;
        }

        .ingredient-item:last-child {
            border-bottom: none;
        }

        @media (max-width: 1024px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Diet & Recipe Manager</h1>
            <p class="subtitle">Track your meals and manage your favorite recipes</p>
        </header>

        <div class="dashboard">
            <div class="stat-card">
                <div class="stat-label">Total Recipes</div>
                <div class="stat-value" id="totalRecipes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Today's Meals</div>
                <div class="stat-value" id="todayMeals">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Today's Calories</div>
                <div class="stat-value" id="todayCalories">0</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">Recipes</h2>
                    <button class="btn btn-primary" onclick="openRecipeModal()">Add Recipe</button>
                </div>
                <div class="recipe-list" id="recipeList">
                    <div class="empty-state">
                        <div class="empty-state-icon">🍳</div>
                        <p>No recipes yet. Add your first recipe to get started!</p>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <h2 class="section-title">Today's Meals</h2>
                    <button class="btn btn-secondary btn-small" onclick="openMealModal()">Log Meal</button>
                </div>
                <div id="mealLog">
                    <div class="empty-state">
                        <div class="empty-state-icon">🍽️</div>
                        <p>No meals logged today</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Recipe Modal -->
    <div class="modal" id="recipeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="recipeModalTitle">Add Recipe</h3>
                <button class="close-btn" onclick="closeRecipeModal()">&times;</button>
            </div>
            <form id="recipeForm" onsubmit="saveRecipe(event)">
                <input type="hidden" id="recipeId">
                <div class="form-group">
                    <label for="recipeName">Recipe Name</label>
                    <input type="text" id="recipeName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="recipeCalories">Calories</label>
                        <input type="number" id="recipeCalories" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="recipeServings">Servings</label>
                        <input type="number" id="recipeServings" min="1" value="1" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="recipeProtein">Protein (g)</label>
                        <input type="number" id="recipeProtein" min="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="recipeCarbs">Carbs (g)</label>
                        <input type="number" id="recipeCarbs" min="0" step="0.1">
                    </div>
                </div>
                <div class="form-group">
                    <label for="recipeIngredients">Ingredients (one per line)</label>
                    <textarea id="recipeIngredients"></textarea>
                </div>
                <div class="form-group">
                    <label for="recipeInstructions">Instructions</label>
                    <textarea id="recipeInstructions"></textarea>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeRecipeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Recipe</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Meal Log Modal -->
    <div class="modal" id="mealModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Log Meal</h3>
                <button class="close-btn" onclick="closeMealModal()">&times;</button>
            </div>
            <form id="mealForm" onsubmit="saveMeal(event)">
                <div class="form-group">
                    <label for="mealRecipe">Select Recipe</label>
                    <select id="mealRecipe" required>
                        <option value="">Choose a recipe...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mealTime">Time</label>
                    <input type="time" id="mealTime" required>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="closeMealModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Log Meal</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Data storage
        let recipes = JSON.parse(localStorage.getItem('recipes') || '[]');
        let meals = JSON.parse(localStorage.getItem('meals') || '[]');

        // Initialize
        function init() {
            renderRecipes();
            renderMealLog();
            updateStats();
            setCurrentTime();
        }

        function setCurrentTime() {
            const now = new Date();
            const time = now.toTimeString().slice(0, 5);
            document.getElementById('mealTime').value = time;
        }

        // Recipe management
        function openRecipeModal(recipeId = null) {
            const modal = document.getElementById('recipeModal');
            const form = document.getElementById('recipeForm');
            form.reset();
            
            if (recipeId) {
                const recipe = recipes.find(r => r.id === recipeId);
                if (recipe) {
                    document.getElementById('recipeModalTitle').textContent = 'Edit Recipe';
                    document.getElementById('recipeId').value = recipe.id;
                    document.getElementById('recipeName').value = recipe.name;
                    document.getElementById('recipeCalories').value = recipe.calories;
                    document.getElementById('recipeServings').value = recipe.servings;
                    document.getElementById('recipeProtein').value = recipe.protein || '';
                    document.getElementById('recipeCarbs').value = recipe.carbs || '';
                    document.getElementById('recipeIngredients').value = recipe.ingredients || '';
                    document.getElementById('recipeInstructions').value = recipe.instructions || '';
                }
            } else {
                document.getElementById('recipeModalTitle').textContent = 'Add Recipe';
                document.getElementById('recipeId').value = '';
            }
            
            modal.classList.add('active');
        }

        function closeRecipeModal() {
            document.getElementById('recipeModal').classList.remove('active');
        }

        function saveRecipe(event) {
            event.preventDefault();
            
            const id = document.getElementById('recipeId').value || Date.now().toString();
            const recipe = {
                id: id,
                name: document.getElementById('recipeName').value,
                calories: parseInt(document.getElementById('recipeCalories').value),
                servings: parseInt(document.getElementById('recipeServings').value),
                protein: parseFloat(document.getElementById('recipeProtein').value) || 0,
                carbs: parseFloat(document.getElementById('recipeCarbs').value) || 0,
                ingredients: document.getElementById('recipeIngredients').value,
                instructions: document.getElementById('recipeInstructions').value
            };

            const existingIndex = recipes.findIndex(r => r.id === id);
            if (existingIndex >= 0) {
                recipes[existingIndex] = recipe;
            } else {
                recipes.push(recipe);
            }

            localStorage.setItem('recipes', JSON.stringify(recipes));
            renderRecipes();
            updateStats();
            closeRecipeModal();
            updateMealRecipeOptions();
        }

        function deleteRecipe(recipeId) {
            if (confirm('Are you sure you want to delete this recipe?')) {
                recipes = recipes.filter(r => r.id !== recipeId);
                localStorage.setItem('recipes', JSON.stringify(recipes));
                renderRecipes();
                updateStats();
                updateMealRecipeOptions();
            }
        }

        function renderRecipes() {
            const container = document.getElementById('recipeList');
            
            if (recipes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🍳</div>
                        <p>No recipes yet. Add your first recipe to get started!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = recipes.map(recipe => `
                <div class="recipe-card">
                    <div class="recipe-header">
                        <div>
                            <div class="recipe-name">${recipe.name}</div>
                            <div class="recipe-meta">
                                <span>${recipe.calories} cal</span>
                                <span>${recipe.servings} serving${recipe.servings > 1 ? 's' : ''}</span>
                                ${recipe.protein ? `<span>${recipe.protein}g protein</span>` : ''}
                                ${recipe.carbs ? `<span>${recipe.carbs}g carbs</span>` : ''}
                            </div>
                        </div>
                        <div class="recipe-actions">
                            <button class="btn btn-secondary btn-small" onclick="openRecipeModal('${recipe.id}')">Edit</button>
                            <button class="btn btn-danger btn-small" onclick="deleteRecipe('${recipe.id}')">Delete</button>
                        </div>
                    </div>
                    ${recipe.ingredients ? `
                        <div class="ingredients-list">
                            ${recipe.ingredients.split('\n').filter(i => i.trim()).map(ingredient => 
                                `<div class="ingredient-item">${ingredient}</div>`
                            ).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // Meal log management
        function openMealModal() {
            updateMealRecipeOptions();
            setCurrentTime();
            document.getElementById('mealModal').classList.add('active');
        }

        function closeMealModal() {
            document.getElementById('mealModal').classList.remove('active');
        }

        function updateMealRecipeOptions() {
            const select = document.getElementById('mealRecipe');
            select.innerHTML = '<option value="">Choose a recipe...</option>' +
                recipes.map(recipe => 
                    `<option value="${recipe.id}">${recipe.name} (${recipe.calories} cal)</option>`
                ).join('');
        }

        function saveMeal(event) {
            event.preventDefault();
            
            const recipeId = document.getElementById('mealRecipe').value;
            const recipe = recipes.find(r => r.id === recipeId);
            const time = document.getElementById('mealTime').value;
            
            const meal = {
                id: Date.now().toString(),
                recipeId: recipeId,
                recipeName: recipe.name,
                calories: recipe.calories,
                time: time,
                date: new Date().toDateString()
            };

            meals.push(meal);
            localStorage.setItem('meals', JSON.stringify(meals));
            renderMealLog();
            updateStats();
            closeMealModal();
            
            document.getElementById('mealForm').reset();
        }

        function deleteMeal(mealId) {
            meals = meals.filter(m => m.id !== mealId);
            localStorage.setItem('meals', JSON.stringify(meals));
            renderMealLog();
            updateStats();
        }

        function renderMealLog() {
            const container = document.getElementById('mealLog');
            const today = new Date().toDateString();
            const todayMeals = meals.filter(m => m.date === today).sort((a, b) => a.time.localeCompare(b.time));

            if (todayMeals.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🍽️</div>
                        <p>No meals logged today</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = todayMeals.map(meal => `
                <div class="meal-log-entry">
                    <div class="meal-time">${meal.time}</div>
                    <div class="meal-name">${meal.recipeName}</div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="meal-calories">${meal.calories} cal</div>
                        <button class="btn btn-danger btn-small" onclick="deleteMeal('${meal.id}')">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const today = new Date().toDateString();
            const todayMeals = meals.filter(m => m.date === today);
            const todayCalories = todayMeals.reduce((sum, meal) => sum + meal.calories, 0);

            document.getElementById('totalRecipes').textContent = recipes.length;
            document.getElementById('todayMeals').textContent = todayMeals.length;
            document.getElementById('todayCalories').textContent = todayCalories;
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
